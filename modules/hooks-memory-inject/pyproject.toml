[project]
name = "amplifier-module-hooks-memory-inject"
version = "0.1.0"
description = "Puts MEMORY.md in front of the model on every request (session.v1 §1, §2, §9, §10)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."amplifier.modules"]
hooks-memory-inject = "amplifier_module_hooks_memory_inject:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "amplifier-core>=1.0.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
