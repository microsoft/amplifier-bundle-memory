[project]
name = "amplifier-module-hooks-memory-inject"
version = "0.1.0"
description = "Puts MEMORY.md in front of the model on every request (session.v1 §1, §2, §9, §10)"
readme = "README.md"
requires-python = ">=3.11"
# AGENTS.md rule 4: a sibling dependency is a self-referential git URL, never a
# relative path and never a bare name.
dependencies = [
    "amplifier-memory @ git+https://github.com/microsoft/amplifier-bundle-memory@main",
]

[project.entry-points."amplifier.modules"]
hooks-memory-inject = "amplifier_module_hooks_memory_inject:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_hooks_memory_inject"]

# Development-only resolution override; never reaches the built wheel, which
# carries the git URL above. It lets `uv run pytest` here run against THIS
# worktree's library, offline, instead of fetching whatever is on `main`.
[tool.uv.sources]
amplifier-memory = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "amplifier-core>=1.0.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
