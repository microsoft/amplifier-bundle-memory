- id: AMM-015
  title: session.v1 Core 6 — `/remember <text>`
  contract:
    file: contracts/session.v1.md
    clause: "Core 6"
    quote: |
      `/remember <text>`
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: test_row_amm_015
  work: amplifier_bundle_memory-yvu
  notes: >
    Kept 2026-09-06 for the half a process can hold. The three commands exist as user-invocable,
    model-invisible skills — skills/{remember,forget,memory}/SKILL.md each carry `user-invocable: true`
    and `disable-model-invocation: true`, the keys tool-skills parses at
    amplifier_module_tool_skills/discovery.py:292-306 — and each calls the `memory` tool with $ARGUMENTS.
    Behaviour measured through the tool: /remember writes exactly what was typed (writer="human", quote
    set to the text itself, which is what store.py requires) and announces
    `Saved memory m-001: "Always run make check before pushing." — /forget m-001 to undo.`; /forget
    announces `Forgot m-001.` and the line leaves MEMORY.md; an unknown id is the one-line error
    `unknown memory id 'm-404'`; /memory prints the ids and `0 pending suggestions` (Phase 1 records
    none). What is NOT asserted by this row: that a human TYPING `/remember …` reaches the tool — that is
    the CLI's dispatch plus model behaviour, and it belongs to the real-host smoke (lane E). Verified by
    reading the installed CLI rather than assumed: `/remember` resolves through SKILL_SHORTCUTS to the
    `load_skill` action (amplifier_app_cli/main.py:797-817), and main.py:3185-3195 turns it into a
    SYNTHETIC prompt — so the literal `/remember <text>` line is never a user message; the synthetic
    prompt is, and it carries the typed text verbatim, which is what makes the human-turn check pass.
    Probes: `cd modules/tool-memory && uv run --offline pytest -q -k test_row_amm_015` (3 passed
    2026-09-06), and conformance/session/tool/run.py prints `Core 6 — Kept`.

