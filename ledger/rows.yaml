- id: AMM-010
  title: session.v1 Core 1 — Loaded in every request.
  contract:
    file: contracts/session.v1.md
    clause: "Core 1"
    quote: |
      Loaded in every request.
  disposition: CONFORMS
  assertion:
    kind: probe
    ref: test_row_amm_010
  work: amplifier_bundle_memory-zqi
  notes: >
    Kept 2026-09-06 by modules/hooks-memory-inject: one handler on provider:request
    returns inject_context / role=system / ephemeral=True carrying the §1 framing
    sentence as the first line inside the envelope, MEMORY.md verbatim, and no topic
    bodies; two instances over the same store are byte-identical and carry no
    timestamp or session id. Probe lives in the module suite: `cd modules/hooks-memory-inject && uv run --offline pytest -q -k test_row_amm_010` (18 passed 2026-09-06). It is NOT yet discovered by the repo-root `uv run pytest` — wiring the module suites into the root gate is a residual for the manager.
    conformance/session/inject/run.py additionally re-extracts the framing sentence
    from the locked contract and compares it byte-for-byte with the module constant,
    so the two cannot drift apart silently. Registration on provider:request (not
    session:start, not context:post_compact) is what makes "every request, including
    after a compaction" true by construction — no first-turn flag exists to go stale.

