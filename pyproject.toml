[project]
name = "amplifier-memory"
version = "0.1.0"
description = "The one home for memory-store behaviour: writer, init, provenance. Every surface is a thin adapter over this."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "pyyaml>=6"]

[project.scripts]
amplifier-memory = "amplifier_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_memory"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests", "ledger/checks"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = [".venv"]
