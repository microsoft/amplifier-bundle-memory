name: Store portability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  store:
    name: Store (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Store imports deliberately do not need Core/Foundation or inference setup.
      # Install only the focused tests' dependencies, not a host or its credentials.
      - name: Install store test dependencies
        run: |
          python -m venv .venv
          .venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }} -m pip install pytest==9.1.1 pyyaml==6.0.3
          .venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }} -m pip install --no-deps -e .
      - name: Exercise real store locks and mutations
        run: >-
          .venv/${{ runner.os == 'Windows' && 'Scripts/python.exe' || 'bin/python' }} -m pytest -q
          tests/test_concurrency.py
          tests/test_store.py::test_store_roundtrip_with_utf8_git_io
          tests/test_store.py::test_git_encoding_overrides_preserve_provenance_and_user_config
          tests/test_store.py::test_git_command_scoped_config_is_documented
          tests/test_store.py::test_public_api_is_exactly_the_contracted_surface
          tests/test_store.py::test_every_mutating_path_runs_under_the_lock
          tests/test_store.py::test_import_pulls_in_neither_click_nor_amplifier
          tests/test_store.py::test_init_creates_the_layout_once_and_is_idempotent
          tests/test_store.py::test_memory_cap_discriminating_pair
          tests/test_store.py::test_topic_line_cap_and_file_cap
          tests/test_store.py::test_every_mutation_is_exactly_one_commit
          tests/test_store.py::test_quote_must_appear_in_a_human_turn
          tests/test_store.py::test_an_inert_instance_refuses_every_write_in_one_line